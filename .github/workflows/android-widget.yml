name: Android widget APK
on:
  push:
    branches: [main]
    paths:
      - 'android-widget-source.zip'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q android-widget-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-widget :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoraFit-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
